# Opens a pull request when an npm package or a GitHub Action has an update or a security fix.
# Minor and patch updates are grouped into one pull request, so there is less to review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
