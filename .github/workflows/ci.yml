# Runs the tests, a production build and a browser smoke test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Uses the Chrome that ubuntu-latest ships with. Not yet seen passing on GitHub: once it has, drop
      # continue-on-error so a failure turns the run red.
      - run: npm run smoke
        continue-on-error: true
      # Lighthouse on the built site (see lighthouserc.json): accessibility, SEO and best practices
      # must stay high, speed only warns. Not yet seen passing on GitHub, so it can't turn the run red
      # for now; drop continue-on-error once it has.
      - run: npx --yes @lhci/cli@0.15.1 autorun
        continue-on-error: true
