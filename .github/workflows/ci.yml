# Runs the tests, a production build and a browser smoke test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Uses the Chrome that ubuntu-latest ships with. Not yet seen passing on GitHub: once it has, drop
      # continue-on-error so a failure turns the run red.
      - run: npm run smoke
        continue-on-error: true
